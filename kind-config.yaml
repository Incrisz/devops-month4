kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30400
        hostPort: 30400
        listenAddress: "127.0.0.1"
        protocol: TCP

  - role: worker

  - role: worker