apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: payments-orders-only
  namespace: mesh-lab
spec:
  selector:
    matchLabels:
      app: payments
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/mesh-lab/sa/orders-sa"]
      to:
        - operation:
            ports: ["8080"]
