apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-accept-orders-only
  namespace: mesh-lab
spec:
  podSelector:
    matchLabels:
      app: payments
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: orders
      ports:
        - protocol: TCP
          port: 8080
