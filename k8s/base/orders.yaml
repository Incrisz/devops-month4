apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: mesh-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: DOCKERHUB_USER/mesh-orders:v1
          ports:
            - containerPort: 8080
          env:
            - name: PAYMENTS_URL
              value: "http://payments:8080"

---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: mesh-lab
spec:
  selector:
    app: orders
  ports:
    - port: 8080
      targetPort: 8080