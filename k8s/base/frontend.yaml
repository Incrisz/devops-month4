apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mesh-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: DOCKERHUB_USER/mesh-frontend:v1
          ports:
            - containerPort: 8080
          env:
            - name: ORDERS_URL
              value: "http://orders:8080"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mesh-lab
spec:
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080