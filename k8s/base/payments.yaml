apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-sa
  namespace: mesh-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: mesh-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      serviceAccountName: payments-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payments
          image: DOCKERHUB_USER/mesh-payments:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: mesh-lab
spec:
  selector:
    app: payments
  ports:
    - name: http
      port: 8080
      targetPort: 8080
