apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: mesh-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: DOCKERHUB_USER/mesh-payments:v1
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: mesh-lab
spec:
  selector:
    app: payments
  ports:
    - port: 8080
      targetPort: 8080